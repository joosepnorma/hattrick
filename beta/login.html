<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Access Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">

    <div class="bg-gray-800 p-8 rounded-lg shadow-lg max-w-md w-full">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">Beta Access</h2>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none" required>
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none" required>
            </div>

            <div id="error-msg" class="text-red-400 text-sm hidden"></div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition">
                Log In
            </button>
        </form>

        <div class="mt-4 text-center">
            <button id="signup-btn" class="text-sm text-gray-400 hover:text-white underline">
                Need an account? Sign Up
            </button>
        </div>
        
        <div class="mt-6 text-center border-t border-gray-700 pt-4">
            <a href="../index.html" class="text-gray-500 hover:text-white text-sm">← Back to Home</a>
        </div>
    </div>

    <script>
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');
        const signupBtn = document.getElementById('signup-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            
            const email = emailInput.value;
            const password = passwordInput.value;

            const { data, error } = await _supabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
            } else {
                window.location.href = 'index.html';
            }
        });

        signupBtn.addEventListener('click', async () => {
             const email = emailInput.value;
             const password = passwordInput.value;
             
             if(!email || !password) {
                 errorMsg.textContent = "Please enter email and password to sign up.";
                 errorMsg.classList.remove('hidden');
                 return;
             }

             const { data, error } = await _supabase.auth.signUp({
                email,
                password
            });

            if (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
            } else {
                alert('Sign up successful! You can now log in.');
            }
        });
    </script>
</body>
</html>
